<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabell</title>
</head>
<body>
    <h2>Handlevogn</h2>
    <table>
        <thead>
            <tr>
                <th>Produkt</th>
                <th>Pris</th>
                <th>Antall</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Playstation 5 Pro</td>
                <td>10 500,-</td>
                <td>2</td>
            </tr>
            <tr>
                <td>Spider-man 2</td>
                <td>699,-</td>
                <td>1</td>
            </tr>
            <tr>
                <td>Call of Duty: Black Ops 6</td>
                <td>899,-</td>
                <td>1</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Sum</td>
                <td>Total</td>
                <td></td>
            </tr>
        </tfoot>
    </table>

    <h2>Filmer</h2>
    <table>
        <thead>
            <tr>
                <th>Navn</th>
                <th>Utgivelsesår</th>
                <th>Hvor kan den strømmes?</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Beetlejuice</td>
                <td>1988</td>
                <td>HBO</td>
            </tr>
            <tr>
                <td><a href="https://www.imdb.com/title/tt0241527/">
                    Harry Potter and the Philisophers Stone</a></td>
                <td>2001</td>
                <td>HBO</td>
            </tr>
            <tr>
                <td>Conan the Barbarian</td>
                <td>1982</td>
                <td>Netflix</td>
            </tr>
        </tbody>
        <tfoot></tfoot>
    </table>
</body>
</html>
